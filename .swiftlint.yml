included:
  - Shared
  - iOS
  - watchOS
  - macOS
  - Tests

excluded:
  - .build
  - DerivedData
  - SkateTrack.xcodeproj
  - SkateTrack.xcworkspace

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_imports

file_length:
  warning: 450
  error: 500
  ignore_comment_only_lines: true

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 3
  excluded:
    - id
    - ui
    - url
    - api
    - gps
    - ml

custom_rules:
  no_hardcoded_swiftui_text:
    name: "No Hardcoded SwiftUI Text"
    regex: 'Text\("[A-Z][^"\.]*"\)'
    message: "Use a localization key such as Text("app.name") instead of hardcoded user-facing text."
    severity: warning
